const wallR=(u,v)=>up(iso(u,0),v);
const wallL=(u,v)=>up(iso(0,u),v);
function poly(c,pts,fill,stroke,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function box(c,gx,gy,w,d,h,top,l,r,base){base=base||0;
  const A=up(iso(gx,gy),base),B=up(iso(gx+w,gy),base),C=up(iso(gx+w,gy+d),base),D=up(iso(gx,gy+d),base);
  poly(c,[D,C,up(C,h),up(D,h)],l);poly(c,[C,B,up(B,h),up(C,h)],r);poly(c,[up(A,h),up(B,h),up(C,h),up(D,h)],top)}
function brilho(c,x,y,rr,cor,a){rr=Math.max(1,rr||1);const g=c.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,cor);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,rr,0,7);c.fill();c.restore()}
function mediaPt(ps){let x=0,y=0;for(const p of ps){x+=p[0];y+=p[1]}return [x/ps.length,y/ps.length]}

// --- móveis e enfeites ---
function tapeteXadrez(c,x0,y0,x1,y1,cor){
  for(let x=x0;x<x1;x+=.5)for(let y=y0;y<y1;y+=.5)
    if(((x*2|0)+(y*2|0))%2)poly(c,[iso(x,y),iso(x+.5,y),iso(x+.5,y+.5),iso(x,y+.5)],cor);
}
function cadeira(c,gx,gy,cor){
  box(c,gx,gy,.45,.45,5,'#1d1a38','#141229','#181534');
  box(c,gx+.05,gy+.05,.35,.35,9,cor,'rgba(0,0,0,.45)','rgba(0,0,0,.3)',5);
  box(c,gx+.05,gy+.3,.35,.1,20,'rgba(0,0,0,.35)','rgba(0,0,0,.5)','rgba(0,0,0,.4)',14);
}
function canecaPapel(c,gx,gy,hue,now,i){
  const p=up(iso(gx,gy),9);
  c.fillStyle='#d9cfe8';c.fillRect(p[0]-2,p[1]-6,4,6);
  c.strokeStyle='#a79cc4';c.lineWidth=1;c.beginPath();c.arc(p[0]+3.4,p[1]-3.5,2,-1.4,1.4);c.stroke();
  c.save();c.globalAlpha=.35+.25*Math.sin(now/500+i);c.strokeStyle='hsla('+hue+',70%,80%,.9)';
  c.beginPath();c.moveTo(p[0],p[1]-9);c.quadraticCurveTo(p[0]+4,p[1]-14,p[0],p[1]-19);c.stroke();c.restore();
}
function pilhaPapel(c,gx,gy){
  for(let i=0;i<3;i++){const q=up(iso(gx,gy),i*2);
    c.fillStyle=i%2?'rgba(226,220,250,.75)':'rgba(190,182,226,.7)';c.fillRect(q[0]-5+i,q[1]-4,10,3)}
}
function quadroAviso(c,hue,now){
  const u0=5.6,u1=6.9,v0=44,v1=82;
  painelL(c,u0,u1,v0,v1,'#2a2448','hsla('+hue+',60%,60%,.45)');
  const pt=(uf,vf)=>wallL(u0+(u1-u0)*uf,v0+(v1-v0)*vf);
  const cor=['#ffd23f','#ff6bd5','#52ff8a','#4db8ff'];
  for(let i=0;i<4;i++){const a=pt(.16+(i%2)*.44,.16+((i/2)|0)*.42),b=pt(.16+(i%2)*.44+.3,.16+((i/2)|0)*.42+.3);
    poly(c,[a,pt(.16+(i%2)*.44+.3,.16+((i/2)|0)*.42),b,pt(.16+(i%2)*.44,.16+((i/2)|0)*.42+.3)],cor[i]+'cc')}
}
function luminaria(c,gx,gy,hue,now){
  const base=iso(gx,gy);
  c.strokeStyle='#3b3568';c.lineWidth=2;c.beginPath();c.moveTo(base[0],base[1]);c.lineTo(base[0],base[1]-46);c.stroke();
  const t=up(iso(gx,gy),46);
  poly(c,[[t[0]-11,t[1]],[t[0]+11,t[1]],[t[0]+6,t[1]-11],[t[0]-6,t[1]-11]],'#4a4280');
  brilho(c,t[0],t[1]+16,34,'hsla('+hue+',90%,70%,.3)',.8+.2*Math.sin(now/900));
}
function bebedouro(c,gx,gy,now){
  box(c,gx,gy,.5,.5,8,'#2e2a52','#1f1c3c','#262246');
  box(c,gx+.08,gy+.08,.34,.34,22,'#8fd8ff','#4d87b8','#5f9cd0',8);
  const p=up(iso(gx+.25,gy+.25),30);
  c.fillStyle='rgba(143,216,255,'+(.4+.3*Math.sin(now/700))+')';c.beginPath();c.ellipse(p[0],p[1],7,3.4,0,0,7);c.fill();
}
function relogio(c,hue,now){
  const m=wallR(.9,76);c.save();
  c.fillStyle='#1b1834';c.beginPath();c.arc(m[0],m[1],11,0,7);c.fill();
  c.strokeStyle='hsla('+hue+',70%,70%,.9)';c.lineWidth=1.5;c.beginPath();c.arc(m[0],m[1],11,0,7);c.stroke();
  const d=new Date(),ah=(d.getHours()%12+d.getMinutes()/60)/12*6.283-1.571,am=d.getMinutes()/60*6.283-1.571;
  c.lineWidth=2;c.beginPath();c.moveTo(m[0],m[1]);c.lineTo(m[0]+Math.cos(ah)*5,m[1]+Math.sin(ah)*5);c.stroke();
  c.lineWidth=1.3;c.beginPath();c.moveTo(m[0],m[1]);c.lineTo(m[0]+Math.cos(am)*8,m[1]+Math.sin(am)*8);c.stroke();c.restore();
}
function poeira(c,hue,now,n){
  c.save();
  for(let i=0;i<n;i++){
    const f=(now/9000+i/n)%1,x=W*0.18+((i*97)%Math.round(W*0.64)),y=H-10-f*(H*.72);
    c.globalAlpha=(1-f)*.3;c.fillStyle='hsla('+hue+',80%,80%,1)';
    c.fillRect(x+Math.sin(now/800+i)*7,y,1.6,1.6);
  }
  c.restore();
}

function planta(c,gx,gy){
  box(c,gx,gy,.55,.55,9,'#9a6240','#6d4530','#7f5035');
  const p=iso(gx+.27,gy+.27);
  for(let i=0;i<4;i++){c.fillStyle=i%2?'#2fa36b':'#45cf8a';c.beginPath();c.ellipse(p[0]+(i-1.5)*5,p[1]-15-(i%2)*6,7,5,(i-1.5)*.4,0,7);c.fill()}
}
function caixas(c,gx,gy,n,now){
  for(let i=0;i<n;i++){const o=i*.06;
    box(c,gx+o,gy-o,.8,.8,11,'#e59b45','#a96a28','#c27f33',i*11);
    const t=up(iso(gx+o+.4,gy-o+.4),i*11+11);c.strokeStyle='rgba(0,0,0,.25)';c.lineWidth=1;c.beginPath();c.moveTo(t[0]-14,t[1]);c.lineTo(t[0]+14,t[1]);c.stroke()}
}
function painelR(c,u0,u1,v0,v1,fill,stroke){poly(c,[wallR(u0,v0),wallR(u1,v0),wallR(u1,v1),wallR(u0,v1)],fill,stroke,2)}
function painelL(c,u0,u1,v0,v1,fill,stroke){poly(c,[wallL(u0,v0),wallL(u1,v0),wallL(u1,v1),wallL(u0,v1)],fill,stroke,2)}
function emblema(c,id,hue,r){
  const u0=3.5,u1=6.3,v0=36,v1=88,ac=(l,a)=>'hsla('+hue+',85%,'+l+'%,'+a+')';
  painelR(c,u0,u1,v0,v1,'rgba(10,8,22,.85)',ac(65,.55+r.ahot*.4));
  const m=mediaPt([wallR(u0,v0),wallR(u1,v0),wallR(u1,v1),wallR(u0,v1)]);
  c.save();c.textAlign='center';c.textBaseline='middle';c.shadowColor=ac(65,1);c.shadowBlur=12+r.ahot*12;
  if(GLIFO[id]){c.fillStyle=ac(70,1);c.font='bold 26px ui-monospace,monospace';c.fillText(GLIFO[id],m[0],m[1])}
  else{c.font='26px sans-serif';c.fillText(EMO[id],m[0],m[1])}
  c.restore();
}
function telao(c,hue,now,fluxos){
  const u0=1.1,u1=5.2,v0=38,v1=86;
  painelL(c,u0,u1,v0,v1,'#0a0818','hsla('+hue+',70%,55%,.5)');
  const pt=(uf,vf)=>wallL(u0+(u1-u0)*uf,v0+(v1-v0)*vf);
  for(let i=0;i<5;i++){
    const vf=.18+i*.17,w=.18+((Math.sin(now/900+i*1.7)+1)/2)*.62;
    poly(c,[pt(.08,vf),pt(.08+w*.84,vf),pt(.08+w*.84,vf+.09),pt(.08,vf+.09)],i<fluxos?'hsla('+hue+',80%,60%,.85)':'rgba(255,255,255,.12)');
  }
}
function propsAgente(c,id,now,hue,r){
  const ac=(l,a)=>'hsla('+hue+',85%,'+l+'%,'+a+')';
  if(id==='infra'||id==='coder'){
    box(c,6.0,1.0,.9,.9,48,'#23203e','#15132a','#1b1935');
    const p=iso(6.1,1.9);
    for(let i=0;i<6;i++){c.fillStyle=Math.sin(now/260+i*1.3)>0?'#52ff8a':'#20543b';c.fillRect(p[0]-7,p[1]-44+i*7,11,3)}
  }
  if(id==='designer'){
    // cavalete com tela e paleta de cores girando
    box(c,5.7,1.1,.15,.15,34,'#2a2748','#1b1a33','#232140');
    const p=up(iso(5.8,1.2),30);c.save();
    poly(c,[[p[0]-16,p[1]-18],[p[0]+14,p[1]-18],[p[0]+14,p[1]+6],[p[0]-16,p[1]+6]],'#fffbe8','rgba(0,0,0,.4)',1);
    for(let i=0;i<4;i++){c.fillStyle='hsl('+((hue+i*55+now/40)%360|0)+',80%,60%)';c.beginPath();c.arc(p[0]-9+i*6,p[1]-6,2.6,0,7);c.fill()}
    c.restore();
  }
  if(id==='watchdog'){
    box(c,6.0,4.6,.5,.5,16,'#2a2748','#1b1a33','#232140');
    const p=up(iso(6.25,4.85),16);c.save();c.strokeStyle=ac(65,.95);c.lineWidth=2;
    c.beginPath();c.arc(p[0],p[1]-4,12,Math.PI,0);c.stroke();
    const a=(now/500)%Math.PI;c.beginPath();c.moveTo(p[0],p[1]-4);c.lineTo(p[0]-Math.cos(a)*12,p[1]-4-Math.sin(a)*12);c.stroke();c.restore();
  }
  if(id==='verifier'){
    const m=wallR(2.1,70);c.save();c.translate(m[0],m[1]);c.rotate(now/1600);c.fillStyle=ac(62,.9);
    for(let i=0;i<8;i++){c.rotate(Math.PI/4);c.fillRect(-2.5,-17,5,6)}
    c.beginPath();c.arc(0,0,12,0,7);c.fill();c.globalCompositeOperation='destination-out';c.beginPath();c.arc(0,0,5,0,7);c.fill();c.restore();
  }
  if(id==='reacher'){
    box(c,.2,6.0,.5,.5,30,'#2a2748','#1b1a33','#232140');
    const p=up(iso(.45,6.25),30);c.save();c.strokeStyle=ac(65,.8);c.lineWidth=2;
    for(let i=1;i<=3;i++){const t=((now/700+i/3)%1);c.globalAlpha=(1-t)*.8;c.beginPath();c.arc(p[0],p[1],6+t*26,Math.PI*1.15,Math.PI*1.85);c.stroke()}
    c.restore();
  }
  if(id==='seller'||id==='posvenda'){
    const p=up(iso(4.6,2.3),44);c.save();c.globalAlpha=.85+.15*Math.sin(now/600);
    c.fillStyle='#fffbe8';c.beginPath();c.moveTo(p[0]-20,p[1]-12);c.lineTo(p[0]+20,p[1]-12);c.lineTo(p[0]+20,p[1]+8);c.lineTo(p[0]+2,p[1]+8);c.lineTo(p[0]-3,p[1]+15);c.lineTo(p[0]-5,p[1]+8);c.lineTo(p[0]-20,p[1]+8);c.closePath();c.fill();
    c.fillStyle='#1b1830';for(let i=0;i<3;i++){const on=((now/400|0)%3)>=i;c.globalAlpha=on?.9:.25;c.beginPath();c.arc(p[0]-8+i*8,p[1]-2,2.4,0,7);c.fill()}
    c.restore();
  }
}
function drawRoom(r,now){
  const c=r.ctx,id=r.id,hue=HUE[id]||220,ac=(l,a)=>'hsla('+hue+',85%,'+l+'%,'+(a==null?1:a)+')';
  OX=r.px;OY=r.py;
  c.clearRect(0,0,W,H);
  const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'rgba(23,19,47,.55)');bg.addColorStop(1,'rgba(11,9,22,.15)');c.fillStyle=bg;c.fillRect(0,0,W,H);
  const A=iso(0,0),B=iso(N,0),D=iso(0,N);
  const g1=c.createLinearGradient(0,A[1]-WH,0,B[1]);g1.addColorStop(0,'#2c2654');g1.addColorStop(1,'#191630');
  poly(c,[A,B,up(B,WH),up(A,WH)],g1);
  const g2=c.createLinearGradient(0,A[1]-WH,0,D[1]);g2.addColorStop(0,'#372f6e');g2.addColorStop(1,'#1d1939');
  poly(c,[A,D,up(D,WH),up(A,WH)],g2);
  for(let x=0;x<N;x++)for(let y=0;y<N;y++)poly(c,[iso(x,y),iso(x+1,y),iso(x+1,y+1),iso(x,y+1)],(x+y)%2?'#39336a':'#433c7b');
  const ct=iso(N/2,N/2);brilho(c,ct[0],ct[1],160,ac(60,.20),.55+r.ahot*.45);
  poly(c,[iso(1.2,3.6),iso(5.2,3.6),iso(5.2,6.2),iso(1.2,6.2)],'rgba(0,0,0,.22)');
  poly(c,[iso(1.4,3.8),iso(5.0,3.8),iso(5.0,6.0),iso(1.4,6.0)],ac(40,.28));
  tapeteXadrez(c,1.4,3.8,5.0,6.0,ac(55,.22));
  const hz=WH-20;
  c.save();c.shadowColor=ac(65,1);c.shadowBlur=12+r.ahot*14;
  poly(c,[wallR(0,hz),wallR(N,hz),wallR(N,hz+6),wallR(0,hz+6)],ac(70,.95));
  poly(c,[wallL(0,hz),wallL(N,hz),wallL(N,hz+6),wallL(0,hz+6)],ac(60,.8));
  c.restore();
  const nf=r.agent?Math.min(5,r.agent.fluxosAtivos||0):0;
  telao(c,hue,now,nf);
  emblema(c,id,hue,r);
  quadroAviso(c,hue,now);
  relogio(c,hue,now);
  planta(c,.15,.15);planta(c,6.3,6.3);planta(c,6.3,.15);
  caixas(c,5.9,5.6,3,now);
  bebedouro(c,.2,2.1,now);
  luminaria(c,.6,5.1,hue,now);
  propsAgente(c,id,now,hue,r);
  box(c,1,6,4,1,11,'#7a3b5e','#5c2b46','#6a3352');
  box(c,1.15,5.85,3.7,.2,19,'#8d476e','#6a3352','#7a3b5e',11);
  pilhaPapel(c,2.1,6.45);pilhaPapel(c,3.6,6.45);
  const placa=up(iso(N/2,0),WH-4);
  c.fillStyle='rgba(10,8,22,.75)';c.fillRect(placa[0]-74,placa[1]-2,148,20);
  c.fillStyle=ac(72,1);c.font='bold 11px ui-monospace,monospace';c.textAlign='center';c.textBaseline='middle';
  c.fillText((r.agent?r.agent.nome:id).toUpperCase().slice(0,18),placa[0],placa[1]+8);
  const sentados=[...r.chars.values()].filter(ch=>ch.seat!=null);
  SPOTS.forEach(([x,y],i)=>{
    box(c,x,y,1.5,.95,9,'#2b2750','#1d1a38','#231f44');
    box(c,x+.08,y+.08,1.34,.79,10.5,'#3b3568','#262248','#2e2a54');
    const o=sentados.find(s=>s.seat===i),st=o?o.state:'idle',col=COL[st];
    cadeira(c,x+.5,y+1.15,o?o.shirt:'#3b3568');
    canecaPapel(c,x+1.3,y+.3,hue,now,i);
    if(i%2===0)pilhaPapel(c,x+.2,y+.72);
    const m=up(iso(x+.7,y+.5),13);
    c.fillStyle='#0c0a16';c.fillRect(m[0]-10,m[1]-24,20,14);
    c.globalAlpha=st==='idle'?.3:.7+.3*Math.sin(now/120+i);c.fillStyle=col;c.fillRect(m[0]-8,m[1]-22,16,10);c.globalAlpha=1;
    if(st!=='idle'){c.globalAlpha=.13;c.fillStyle=col;c.beginPath();c.ellipse(m[0],m[1]+6,40,17,0,0,7);c.fill();c.globalAlpha=1}
  });
  MOSTRA.v=r.ahot;MOSTRA.alvo=null;
  if(r.mx>-900){let md=1e9;for(const ch of r.chars.values()){const p=iso(ch.x,ch.y),d=Math.hypot(p[0]-r.mx,p[1]-r.my-20);if(d<md&&d<48){md=d;MOSTRA.alvo=ch}}}
  const cs=[...r.chars.values()].sort((a,b)=>(a.x+a.y)-(b.x+b.y));cs.forEach(ch=>drawChar(c,ch,now));
  if(r.rip){const t=(now-r.rip.t)/700;
    if(t<1){c.save();c.strokeStyle=ac(72,1-t);c.lineWidth=2;c.beginPath();c.ellipse(r.rip.x,r.rip.y,12+t*100,(12+t*100)*.5,0,0,7);c.stroke();c.restore()}else r.rip=null}
  poeira(c,hue,now,14);
  const vg=c.createRadialGradient(W/2,H/2,H*.35,W/2,H/2,H*.85);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.45)');
  c.fillStyle=vg;c.fillRect(0,0,W,H);
}
const MOSTRA={v:0,alvo:null};
function tom(hex,f){
  if(typeof hex!=='string')hex='#888888';
  if(hex[0]!=='#')return hex;
  const h=hex.replace('#',''),n=parseInt(h.length===3?h.split('').map(c=>c+c).join(''):h,16);
  const r=Math.min(255,Math.round((n>>16&255)*f)),g=Math.min(255,Math.round((n>>8&255)*f)),b=Math.min(255,Math.round((n&255)*f));
  return 'rgb('+r+','+g+','+b+')';
}
function vx(c,gx,gy,w,d,h,base,cor){ box(c,gx,gy,w,d,h,tom(cor,1.22),tom(cor,.58),tom(cor,.85),base) }
const AFK=['parado','espreguicar','bocejar','cafe','olhar','cochilo','alongar'];
const EMOTE={espreguicar:'',bocejar:'',cafe:'☕',olhar:'👀',cochilo:'💤',alongar:''};
function drawChar(c,a,now){
  const moving=Math.hypot(a.tx-a.x,a.ty-a.y)>.05;
  let bob=moving?Math.abs(Math.sin(now/90))*2.5:(a.state==='idle'?Math.sin(now/700)*.8:0);
  if(a.pulo){const t=(now-a.pulo)/520;if(t<1)bob+=Math.sin(t*Math.PI)*16;else a.pulo=0}
  const act=moving?'andando':(a.acao||'parado'),ft=a.acaoT?(now-a.acaoT)/1000:0;
  // modificadores da animacao
  let braco=0,cabeca=0,inclina=0,escala=1;
  if(act==='espreguicar'){const k=Math.min(1,ft/1.1);braco=Math.sin(k*Math.PI)*13;escala=1+Math.sin(k*Math.PI)*.1}
  else if(act==='alongar'){inclina=Math.sin(ft*2.2)*.09}
  else if(act==='bocejar'){cabeca=-Math.sin(Math.min(1,ft/1.2)*Math.PI)*2.5}
  else if(act==='cochilo'){cabeca=-3;bob=Math.sin(now/1100)*1.6}
  else if(act==='olhar'){inclina=Math.sin(ft*1.6)*.06}
  const B=bob,gx=a.x+inclina,gy=a.y-inclina;
  const [sx,sy]=iso(gx,gy);
  // sombra
  c.save();c.fillStyle='rgba(0,0,0,.38)';c.beginPath();c.ellipse(sx,sy,12,5,0,0,7);c.fill();c.restore();
  const calca='#2f2b52',w=.3,d=.27,x0=gx-w/2,y0=gy-d/2;
  // pernas
  const passo=moving?Math.sin(now/95)*2.8:0;
  vx(c,x0+.02,y0+.14,.11,.11,14+passo,B,calca);
  vx(c,x0+.17,y0+.02,.11,.11,14-passo,B,calca);
  vx(c,x0+.01,y0+.13,.13,.13,3,B,'#17152c');
  vx(c,x0+.16,y0+.01,.13,.13,3,B,'#17152c');
  // tronco
  const th=18*escala,tb=B+14;
  vx(c,x0,y0,w,d,th,tb,a.shirt);
  vx(c,x0+.02,y0+.02,w-.04,d-.04,1.6,tb+th,tom(a.shirt,.68));
  // bracos
  const digita=!moving&&a.state==='work',sw=digita?(Math.sin(now/70)>0?2:0):0;

function finCfg(k,pad){const l=(F.lancamentos||[]).find(x=>x.tipo==='config'&&x.item===k);return l&&l.valor!=null?Number(l.valor):pad}
function finBRL(l){const c=finCfg('cambio',5.5);return (l.moeda==='USD'?c:1)*Number(l.valor||0)}
function mesesEntre(a,b){return (b.getFullYear()-a.getFullYear())*12+b.getMonth()-a.getMonth()}
// quantas vezes o lançamento cobrou até hoje
function ciclos(l,ate){if(l.valor==null||!l.inicio)return l.valor==null?0:1;const i=new Date(l.inicio+'T12:00:00'),f=l.fim?new Date(l.fim+'T12:00:00'):ate,fim=f<ate?f:ate;if(fim<i)return 0;
  if(l.recorrencia==='unico')return 1;if(l.recorrencia==='anual')return Math.floor(mesesEntre(i,fim)/12)+1;return mesesEntre(i,fim)+1}
// valor do lançamento dentro de um mês (YYYY-MM)
function noMes(l,ym){if(l.valor==null)return 0;const v=finBRL(l),ini=mesDe(l.inicio),fim=mesDe(l.fim);
  if(l.recorrencia==='unico')return ini===ym?v:0;
  if(ini&&ym<ini)return 0;if(fim&&ym>fim)return 0;
  if(l.recorrencia==='anual')return ini&&ini.slice(5)===ym.slice(5)?v:0;return v}
function finCalc(){const L=(F.lancamentos||[]).filter(l=>l.tipo!=='config'),hoje=new Date(),m=F.metricas||{};
  const gasto=L.filter(l=>l.tipo==='gasto'&&l.status!=='previsto'),rec=L.filter(l=>l.tipo==='receita'&&['pago','ativo'].includes(l.status)),prev=L.filter(l=>l.tipo==='receita'&&l.status==='previsto');
  const gTot=gasto.reduce((s,l)=>s+finBRL(l)*ciclos(l,hoje),0),rTotMan=rec.reduce((s,l)=>s+finBRL(l)*ciclos(l,hoje),0),rTot=rTotMan+(m.receitaAuto||0);
  const ym=hoje.toISOString().slice(0,7),gMes=gasto.reduce((s,l)=>s+noMes(l,ym),0),rMes=rec.reduce((s,l)=>s+noMes(l,ym),0)+(m.cobrancasPagas||[]).filter(c=>mesDe(c.pagoEm)===ym).reduce((s,c)=>s+c.valor,0);
  const fixo=gasto.filter(l=>l.status==='ativo'&&l.valor!=null&&l.recorrencia!=='unico').reduce((s,l)=>s+finBRL(l)*(l.recorrencia==='anual'?1/12:1),0);
  const meses=[];for(let k=5;k>=0;k--){const d=new Date(hoje.getFullYear(),hoje.getMonth()-k,1),y=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    meses.push({ym:y,g:gasto.reduce((s,l)=>s+noMes(l,y),0),r:rec.reduce((s,l)=>s+noMes(l,y),0)+(m.cobrancasPagas||[]).filter(c=>mesDe(c.pagoEm)===y).reduce((s,c)=>s+c.valor,0)})}
  const cat={};gasto.filter(l=>l.status==='ativo'&&l.valor!=null&&l.recorrencia!=='unico').forEach(l=>{cat[l.categoria||'Outros']=(cat[l.categoria||'Outros']||0)+finBRL(l)*(l.recorrencia==='anual'?1/12:1)});
  const prevTot=prev.reduce((s,l)=>s+finBRL(l)*(l.recorrencia==='mensal'?1:1),0),falta=L.filter(l=>l.tipo==='gasto'&&(l.valor==null||l.status==='preencher'));
  return {gTot,rTot,saldo:rTot-gTot,gMes,rMes,fixo,meses,cat,prevTot,falta,L,ym}}

   ['🔥','3 dias seguidos',(m.melhorStreak||0)>=3],['⚡','7 dias seguidos',(m.melhorStreak||0)>=7],['🌋','30 dias seguidos',(m.melhorStreak||0)>=30],
   ['💬','Primeira resposta',(m.respostasTotal||0)>=1],['🗣️','10 respostas',(m.respostasTotal||0)>=10],['🎨','Primeira demo',(m.demos||0)>=1],
   ['🤝','Primeira venda',vendas>=1],['🏅','5 vendas',vendas>=5],['👑','10 vendas',vendas>=10],['💵','R$ 1.000 faturados',c.rTot>=1000],['🏦','R$ 10.000 faturados',c.rTot>=10000],['🟢','Saldo positivo',c.rTot>0&&c.saldo>0],['🔁','1ª mensalidade',(m.clientesAtivos||0)>=1]];
  return {xp,n,atual,prox,pct,quests,badges,m}}
function finMetas(){const g=gam(),m=g.m;
  let h='<div class="glassy pad lvl"><div class="big">'+g.atual[2]+'</div><div style="flex:1"><div class="mut">NÍVEL '+(g.n+1)+'</div><h2>'+esc(g.atual[1])+'</h2><div class="xp"><i style="width:'+g.pct+'%"></i></div><div class="mut">'+g.xp+' XP'+(g.prox?' · faltam '+(g.prox[0]-g.xp)+' XP para '+esc(g.prox[1]):' · nível máximo')+'</div></div></div>'+
   '<div class="kpis" style="margin:8px 0 10px"><span class="pill">🔥 sequência <b>'+(m.streak||0)+'</b> dia(s)</span><span class="pill">recorde <b>'+(m.melhorStreak||0)+'</b></span><span class="pill">enviados <b>'+(m.enviadosTotal||0)+'</b></span><span class="pill">respostas <b>'+(m.respostasTotal||0)+'</b></span><span class="pill">demos <b>'+(m.demos||0)+'</b></span><span class="pill">vendas <b>'+(m.sitesVendidos||0)+'</b></span></div>'+
   '<div class="two"><div><h2>🎯 Missões</h2>'+g.quests.map(q=>{const p=Math.round(q.a/Math.max(1,q.b)*100),ok=p>=100;return '<div class="glassy q'+(ok?' ok':'')+'"><div class="t"><span>'+q.e+' '+esc(q.t)+'</span><span class="mut">'+(ok?'✅ ':'')+esc(q.xp)+'</span></div><div class="bar"><i style="width:'+p+'%;'+(ok?'background:var(--grn)':'')+'"></i></div><div class="mut">'+(q.money?brl(q.a)+' / '+brl(q.b):q.a+' / '+q.b)+' · '+esc(q.d)+'</div></div>'}).join('')+
   '<p class="mut">Metas editáveis: <a href="#" id="f-mrec">receita do mês</a> · <a href="#" id="f-menv">envios por dia</a></p></div>'+
   '<div><h2>🏅 Conquistas ('+g.badges.filter(b=>b[2]).length+'/'+g.badges.length+')</h2><div class="badges">'+g.badges.map(b=>'<div class="glassy bd'+(b[2]?'':' off')+'"><span class="e">'+b[0]+'</span>'+esc(b[1])+'</div>').join('')+'</div></div></div>';
  return h}
function finMetaEd(k,rot,pad){return async ev=>{ev.preventDefault();const v=prompt(rot,finCfg(k,pad));if(!v)return;try{await finSalvar({lanc_id:k==='meta_receita_mes'?'CFG-META-RECEITA':'CFG-META-ENVIOS',tipo:'config',categoria:'config',item:k,valor:v,moeda:'BRL',recorrencia:'unico',status:'ativo'});await finBuscar(true)}catch(e){}}}
function finRender(forca){const box=$('fin');if(!box)return;
  if(!F){box.innerHTML='<p class="mut">Carregando o balanço…</p>';return}
  const foco=document.activeElement&&box.contains(document.activeElement)&&/INPUT|SELECT/.test(document.activeElement.tagName);if(foco&&finSig&&!forca)return;
  const sig=JSON.stringify([F,finSub,finEdit&&finEdit.id]);if(sig===finSig)return;finSig=sig;
  box.innerHTML='<div class="fsub"><button data-s="bal" class="'+(finSub==='bal'?'on':'')+'">💰 Balanço</button><button data-s="met" class="'+(finSub==='met'?'on':'')+'">🎮 Metas</button></div>'+(finSub==='bal'?finBal():finMetas());
  box.querySelectorAll('.fsub button').forEach(b=>b.onclick=()=>{finSub=b.dataset.s;store.set('hf_fsub',finSub);finSig='';finRender()});
  if(finSub==='bal')finLig(box);else{const a=$('f-mrec'),b=$('f-menv');if(a)a.onclick=finMetaEd('meta_receita_mes','Meta de receita do mês (R$):',2000);if(b)b.onclick=finMetaEd('meta_envios_dia','Meta de envios por dia:',20)}}
async function finBuscar(forca){if(!KEY)return;if(!forca&&document.hidden)return;
  try{const c=new AbortController(),to=setTimeout(()=>c.abort(),30000);const res=await fetch(API_FIN+'?k='+encodeURIComponent(KEY),{signal:c.signal,cache:'no-store'});clearTimeout(to);if(!res.ok)throw new Error(res.status);F=await res.json();finRender(forca)}catch(e){if(!F)$('fin').innerHTML='<p class="mut">Não consegui carregar o balanço agora. Tento de novo em instantes.</p>'}}

// ====== dados ======
async function buscar(){
  if(!KEY){$('gate').classList.add('on');return}
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),30000);
    const res=await fetch(API+'?k='+encodeURIComponent(KEY),{signal:c.signal,cache:'no-store'});clearTimeout(to);
    if(res.status===401||res.status===404){store.del('hf_k');KEY='';$('err').textContent='Chave incorreta.';$('gate').classList.add('on');return}
    if(!res.ok)throw new Error(res.status);
    D=await res.json();lastOk=Date.now();$('gate').classList.remove('on');render();
  }catch(e){}
  status();
}
function status(){const l=$('live');if(!lastOk){l.className='off';l.textContent='● sem conexão';return}const s=(Date.now()-lastOk)/1000;
  if(s<POLL/1000*2.5){l.className='on';l.textContent='● ao vivo · '+new Date(Date.parse(D.geradoEm)).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
  else{l.className='off';l.textContent='● desatualizado ('+Math.floor(s/60)+' min)'}}
$('gf').onsubmit=e=>{e.preventDefault();KEY=$('gk').value.trim();store.set('hf_k',KEY);$('err').textContent='';buscar()};
buscar();mira();setInterval(buscar,POLL);finBuscar(true);setInterval(finBuscar,60000);setInterval(status,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)buscar()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
