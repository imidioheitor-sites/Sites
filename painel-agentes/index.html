<script>
// ====== configuração ======
const API='https://himidio.app.n8n.cloud/webhook/painel-agentes-dados';
const DONO='https://himidio.app.n8n.cloud/webhook/painel-helu';
const POLL=20000;
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let KEY=store.get('hf_k')||'';
const hm=location.hash.match(/k=([^&]+)/);if(hm){KEY=decodeURIComponent(hm[1]);store.set('hf_k',KEY);history.replaceState(null,'',location.pathname+location.search)}
let D=null,lastOk=0;

// ====== sala isométrica 3D (estilo Factory Hotel) ======
const TW=42,TH=21,N=7,W=420,H=284,WH=106,Y0=110;
const COL={work:'#52ff8a',erro:'#ff5d5d',wait:'#ff5d5d',think:'#c18bff',idle:'#6d6b96'};
const ICON={work:'⚙',erro:'❗',wait:'❗',think:'💭',idle:'💤'};
const ESTADO={work:'trabalhando',erro:'com erro',wait:'precisa de você',think:'ativo agora',idle:'em espera'};
const HUE={seller:210,designer:305,coder:145,reacher:340,watchdog:35,verifier:275,posvenda:185,infra:250};
const EMO={seller:'💬',designer:'🎨',coder:'🖥',reacher:'📞',watchdog:'🐕',verifier:'🔧',posvenda:'🧾',infra:'🗄'};
const GLIFO={designer:'◐',coder:'</>',verifier:'✓',watchdog:'⚠'};
const hash=s=>{let h=7;for(const c of String(s))h=(h*31+c.charCodeAt(0))>>>0;return h};
const HAIR=['#2b1b12','#7a4a21','#d9a441','#c2412d','#3c3c52','#e8e0d0','#2fa36b','#7c4dff'];
const SHIRT=['#e94f4f','#4f8fe9','#4fc97a','#e9b84f','#a24fe9','#4fd5e9','#e94fa3','#8fa3b5'];
const SKIN=['#f2c9a0','#e0a878','#b9774a','#8a5233'];
const SPOTS=[[1,1],[3,1],[5,1],[1,3],[3,3],[5,3]];
const IDLE=[[.9,4.4],[2.4,5.6],[4.3,5.9],[5.9,4.5],[6.1,2.6],[3.4,4.6],[1.6,6.2],[5.2,6.4]];
const limpa=n=>String(n).replace(/^HELU FACTORY \|\s*/,'').replace(/^(Seller|Designer|Coder|Reacher|Watchdog|Verifier|Pos-venda|Infra|Testes)\s*\|\s*/i,'');
const R={};
function sala(id){ if(R[id])return R[id];
  const cv=document.createElement('canvas'),dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr;cv.height=H*dpr;const ctx=cv.getContext('2d');ctx.scale(dpr,dpr);
  R[id]={id,cv,ctx,chars:new Map(),agent:null,vis:true,px:0,py:0,ax:0,ay:0,hot:0,ahot:0,mx:-999,my:-999,rip:null};
  return R[id]}
let OX=0,OY=0;
const iso=(gx,gy)=>[W/2+(gx-gy)*TW/2+OX,Y0+(gx+gy)*TH/2+OY];
const up=(p,h)=>[p[0],p[1]-h];
const wallR=(u,v)=>up(iso(u,0),v);
const wallL=(u,v)=>up(iso(0,u),v);
function poly(c,pts,fill,stroke,lw){c.beginPath();pts.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.closePath();if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=lw||1;c.stroke()}}
function box(c,gx,gy,w,d,h,top,l,r,base){base=base||0;
  const A=up(iso(gx,gy),base),B=up(iso(gx+w,gy),base),C=up(iso(gx+w,gy+d),base),D=up(iso(gx,gy+d),base);
  poly(c,[D,C,up(C,h),up(D,h)],l);poly(c,[C,B,up(B,h),up(C,h)],r);poly(c,[up(A,h),up(B,h),up(C,h),up(D,h)],top)}
function brilho(c,x,y,rr,cor,a){rr=Math.max(1,rr||1);const g=c.createRadialGradient(x,y,0,x,y,rr);g.addColorStop(0,cor);g.addColorStop(1,'rgba(0,0,0,0)');c.save();c.globalAlpha=a;c.fillStyle=g;c.beginPath();c.arc(x,y,rr,0,7);c.fill();c.restore()}
function mediaPt(ps){let x=0,y=0;for(const p of ps){x+=p[0];y+=p[1]}return [x/ps.length,y/ps.length]}

// --- móveis e enfeites ---
function tapeteXadrez(c,x0,y0,x1,y1,cor){
  for(let x=x0;x<x1;x+=.5)for(let y=y0;y<y1;y+=.5)
    if(((x*2|0)+(y*2|0))%2)poly(c,[iso(x,y),iso(x+.5,y),iso(x+.5,y+.5),iso(x,y+.5)],cor);
}
function cadeira(c,gx,gy,cor){
  box(c,gx,gy,.45,.45,5,'#1d1a38','#141229','#181534');
  box(c,gx+.05,gy+.05,.35,.35,9,cor,'rgba(0,0,0,.45)','rgba(0,0,0,.3)',5);
  box(c,gx+.05,gy+.3,.35,.1,20,'rgba(0,0,0,.35)','rgba(0,0,0,.5)','rgba(0,0,0,.4)',14);
}
function canecaPapel(c,gx,gy,hue,now,i){
  const p=up(iso(gx,gy),9);
  c.fillStyle='#d9cfe8';c.fillRect(p[0]-2,p[1]-6,4,6);
  c.strokeStyle='#a79cc4';c.lineWidth=1;c.beginPath();c.arc(p[0]+3.4,p[1]-3.5,2,-1.4,1.4);c.stroke();
  c.save();c.globalAlpha=.35+.25*Math.sin(now/500+i);c.strokeStyle='hsla('+hue+',70%,80%,.9)';
  c.beginPath();c.moveTo(p[0],p[1]-9);c.quadraticCurveTo(p[0]+4,p[1]-14,p[0],p[1]-19);c.stroke();c.restore();
}
function pilhaPapel(c,gx,gy){
  for(let i=0;i<3;i++){const q=up(iso(gx,gy),i*2);
    c.fillStyle=i%2?'rgba(226,220,250,.75)':'rgba(190,182,226,.7)';c.fillRect(q[0]-5+i,q[1]-4,10,3)}
}
function quadroAviso(c,hue,now){
  const u0=5.6,u1=6.9,v0=44,v1=82;
  painelL(c,u0,u1,v0,v1,'#2a2448','hsla('+hue+',60%,60%,.45)');
  const pt=(uf,vf)=>wallL(u0+(u1-u0)*uf,v0+(v1-v0)*vf);
  const cor=['#ffd23f','#ff6bd5','#52ff8a','#4db8ff'];
  for(let i=0;i<4;i++){const a=pt(.16+(i%2)*.44,.16+((i/2)|0)*.42),b=pt(.16+(i%2)*.44+.3,.16+((i/2)|0)*.42+.3);
    poly(c,[a,pt(.16+(i%2)*.44+.3,.16+((i/2)|0)*.42),b,pt(.16+(i%2)*.44,.16+((i/2)|0)*.42+.3)],cor[i]+'cc')}
}
function luminaria(c,gx,gy,hue,now){
  const base=iso(gx,gy);
  c.strokeStyle='#3b3568';c.lineWidth=2;c.beginPath();c.moveTo(base[0],base[1]);c.lineTo(base[0],base[1]-46);c.stroke();
  const t=up(iso(gx,gy),46);
  poly(c,[[t[0]-11,t[1]],[t[0]+11,t[1]],[t[0]+6,t[1]-11],[t[0]-6,t[1]-11]],'#4a4280');
  brilho(c,t[0],t[1]+16,34,'hsla('+hue+',90%,70%,.3)',.8+.2*Math.sin(now/900));
}
function bebedouro(c,gx,gy,now){
  box(c,gx,gy,.5,.5,8,'#2e2a52','#1f1c3c','#262246');
  box(c,gx+.08,gy+.08,.34,.34,22,'#8fd8ff','#4d87b8','#5f9cd0',8);
  const p=up(iso(gx+.25,gy+.25),30);
  c.fillStyle='rgba(143,216,255,'+(.4+.3*Math.sin(now/700))+')';c.beginPath();c.ellipse(p[0],p[1],7,3.4,0,0,7);c.fill();
}
function relogio(c,hue,now){

  cv.addEventListener('pointerdown',ev=>{const[x,y]=pos(ev);r.rip={x,y,t:performance.now()};r.mx=x;r.my=y;r.hot=1;
    for(const ch of r.chars.values()){const sx=W/2+(ch.x-ch.y)*TW/2,sy=Y0+(ch.x+ch.y)*TH/2;
      if(Math.hypot(sx-x,sy-y)<70){ch.pulo=performance.now()}}},{passive:true});
  el.addEventListener('pointerenter',()=>{r.hot=1});
  el.addEventListener('pointerleave',()=>{r.hot=0});
}
function frame(now){
  for(const r of Object.values(R)){ if(!r.vis)continue;
    r.px+=(r.ax-r.px)*.08;r.py+=(r.ay-r.py)*.08;r.ahot+=(r.hot-r.ahot)*.07;
    for(const ch of r.chars.values()){const dx=ch.tx-ch.x,dy=ch.ty-ch.y,d=Math.hypot(dx,dy);if(d>.02){const s=Math.min(d,.077);ch.x+=dx/d*s;ch.y+=dy/d*s}}
    drawRoom(r,now)}
  if(!document.hidden)requestAnimationFrame(frame);else setTimeout(()=>requestAnimationFrame(frame),1000)}
const io=('IntersectionObserver' in window)?new IntersectionObserver(es=>es.forEach(e=>{const r=Object.values(R).find(x=>x.cv===e.target.querySelector('canvas'));if(r)r.vis=e.isIntersecting}),{rootMargin:'100px'}):null;
requestAnimationFrame(frame);

    let el=document.getElementById('room-'+a.id);
    if(!el){el=document.createElement('div');el.className='room';el.id='room-'+a.id;el.innerHTML='<button class="rh"></button>';el.appendChild(R[a.id].cv);box.appendChild(el);el.querySelector('button').onclick=()=>detalhe(a.id);if(io)io.observe(el);ligarInteracao(el,R[a.id]);vidro(el)}

  $('rank').innerHTML=ag.map(a=>'<div class="row"><span><span class="dot" style="background:'+COL[a.estado]+'"></span>'+esc(a.nome)+'</span><span>Lv'+(Math.floor(Math.sqrt(a.xp/5))+1)+' · '+a.xp+'xp</span></div><div class="bar"><i style="width:'+(a.xp/mx*100)+'%"></i></div>').join('');
  const A=Object.fromEntries(d.agentes.map(a=>[a.id,a])),dot=id=>'<span class="dot" style="background:'+COL[A[id].estado]+'"></span>'+esc(A[id].nome)+' <span class="mut">'+ESTADO[A[id].estado]+'</span>';
  $('org').innerHTML='<div>👤 <b>Heitor</b></div><div class="org">'+dot('reacher')+' <span class="mut">(único canal até você)</span>'+
   '<div class="org">'+dot('seller')+'<div class="org">'+(A.designer?dot('designer')+'<div class="org">':'')+dot('coder')+(A.designer?'</div>':'')+'</div><div class="org">'+dot('posvenda')+'</div></div>'+
   '<div class="org">'+dot('watchdog')+'</div><div class="org">'+dot('verifier')+'</div><div class="org">'+dot('infra')+'</div></div>';
  // precisa de você
  let h='<h2>O que precisa de você (<span data-highlighter data-action="circle" data-color="'+(r.precisaHeitor?'#ff5d5d':'#52ff8a')+'" data-stroke-width="1.5" data-iterations="2">'+r.precisaHeitor+'</span>)</h2>';
  d.escalacoes.forEach(e=>h+='<div class="card urg"><div class="t">'+esc(e.empresa)+'<span class="tag">lead pedindo você</span></div><p>'+esc(e.motivo)+'</p>'+(e.sugestao?'<p><b>Sugestão:</b> '+esc(e.sugestao)+'</p>':'')+'<p>Tel '+esc(e.telefone)+'</p></div>');
  d.avisos.forEach(e=>h+='<div class="card urg"><div class="t">'+esc(e.titulo)+'<span class="tag">'+esc(e.severidade||'aviso')+'</span><span class="tag">'+esc(e.origem)+'</span></div><p>'+esc(e.detalhe)+'</p></div>');

let curSheet=null;
function detalhe(id,keep){
  const a=D.agentes.find(x=>x.id===id);if(!a)return;curSheet=id;
  let h='<button class="x" onclick="fechar()">fechar</button><h2 style="margin-top:0">'+EMO[id]+' '+esc(a.nome)+' <span class="chip '+a.estado+'">'+ESTADO[a.estado]+'</span></h2><p class="mut">'+esc(a.papel)+'<br>24h: '+a.execs24h+' execuções, '+a.erros24h+' com erro · última: '+rel(a.ultimaExec)+'</p>';

function fechar(){$('sheet').classList.remove('on');curSheet=null}
$('sheet').onclick=e=>{if(e.target.id==='sheet')fechar()};
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===b));document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.id==='t-'+b.dataset.t));scrollTo(0,0)});

async function buscar(){
  if(!KEY){$('gate').classList.add('on');return}
  try{
    const c=new AbortController(),to=setTimeout(()=>c.abort(),30000);
    const res=await fetch(API+'?k='+encodeURIComponent(KEY),{signal:c.signal,cache:'no-store'});clearTimeout(to);
    if(res.status===401||res.status===404){store.del('hf_k');KEY='';$('err').textContent='Chave incorreta.';$('gate').classList.add('on');return}
    if(!res.ok)throw new Error(res.status);
    D=await res.json();lastOk=Date.now();$('gate').classList.remove('on');render();
  }catch(e){}
  status();
}
function status(){const l=$('live');if(!lastOk){l.className='off';l.textContent='● sem conexão';return}const s=(Date.now()-lastOk)/1000;
  if(s<POLL/1000*2.5){l.className='on';l.textContent='● ao vivo · '+new Date(Date.parse(D.geradoEm)).toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}
  else{l.className='off';l.textContent='● desatualizado ('+Math.floor(s/60)+' min)'}}
$('gf').onsubmit=e=>{e.preventDefault();KEY=$('gk').value.trim();store.set('hf_k',KEY);$('err').textContent='';buscar()};
buscar();mira();setInterval(buscar,POLL);setInterval(status,5000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)buscar()});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
