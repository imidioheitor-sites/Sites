<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Study Hubs</title>
<style>
:root{color-scheme:dark;--bg:#0d0f14;--bar:#151922;--tx:#e8eaf0;--mut:#8b93a7}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--tx);font:14px/1.3 system-ui,sans-serif}
body{display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:8px;background:var(--bar);border-bottom:1px solid #232938;padding:6px 10px}
#tabs{display:flex;gap:6px;overflow-x:auto;flex:1;scrollbar-width:thin}
#tabs button{flex:none;border:1px solid #2a3042;background:transparent;color:var(--mut);padding:7px 12px;border-radius:8px;cursor:pointer;font:inherit;white-space:nowrap}
#tabs button.on{color:var(--tx);border-color:var(--c);background:color-mix(in srgb,var(--c) 18%,transparent)}
#tabs button b{color:var(--c);margin-right:6px}
.act{flex:none;border:1px solid #2a3042;background:transparent;color:var(--mut);padding:7px 10px;border-radius:8px;cursor:pointer;font:inherit}
main{flex:1;position:relative;min-height:0}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
iframe.on{display:block}
@media(max-width:600px){#tabs button span{display:none}}
</style>
</head>
<body>
<header>
  <nav id="tabs"></nav>
  <button class="act" id="exp" title="Baixar backup do progresso">Backup</button>
  <button class="act" id="imp" title="Restaurar backup">Restaurar</button>
  <input type="file" id="file" accept="application/json" hidden>
</header>
<main id="frames"></main>
<script>
const TABS = [{"slug": "chem-10171", "codigo": "CHEM 10171", "nome": "Intro to Chemical Principles", "cor": "#3DDC97"}, {"slug": "chem-11171", "codigo": "CHEM 11171", "nome": "Chemical Principles Laboratory", "cor": "#3DDC97"}, {"slug": "eg-10117", "codigo": "EG 10117", "nome": "Engineering Design", "cor": "#5CC8FF"}, {"slug": "llro-13186", "codigo": "LLRO 13186", "nome": "Brazil in a Global Context", "cor": "#3DDC97"}, {"slug": "math-10560", "codigo": "MATH 10560", "nome": "Calculus II", "cor": "#7C5CFF"}, {"slug": "mor-10101", "codigo": "MOR 10101", "nome": "Moreau First-Year Seminar", "cor": "#FFB547"}, {"slug": "wr-11100", "codigo": "WR 11100", "nome": "Writing Studio", "cor": "#FFB547"}];
const KEY = 'studyhubs:tab';
const ls = {
  get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } },
  set(k,v){ try { localStorage.setItem(k,v); } catch(e){} }
};
const nav = document.getElementById('tabs'), box = document.getElementById('frames');
const slugs = TABS.map(t => t.slug);
const frames = {};

function show(slug, push){
  if (!slugs.includes(slug)) slug = slugs[0];
  if (!slug) return;
  for (const t of TABS) {
    nav.querySelector(`[data-s="${t.slug}"]`).classList.toggle('on', t.slug === slug);
    if (frames[t.slug]) frames[t.slug].classList.toggle('on', t.slug === slug);
  }
  if (!frames[slug]) {
    const f = document.createElement('iframe');
    f.src = 'hubs/' + slug + '.html';
    f.title = slug;
    box.appendChild(f);
    frames[slug] = f;
    f.classList.add('on');
  }
  const t = TABS.find(x => x.slug === slug);
  document.title = t.codigo + ' · Study Hubs';
  ls.set(KEY, slug);
  if (push) { try { history.replaceState(null, '', '#' + slug); } catch(e){} }
}

for (const t of TABS) {
  const b = document.createElement('button');
  b.dataset.s = t.slug;
  b.style.setProperty('--c', t.cor);
  b.innerHTML = '<b>' + t.codigo + '</b><span>' + t.nome + '</span>';
  b.onclick = () => show(t.slug, true);
  nav.appendChild(b);
}
addEventListener('hashchange', () => show(location.hash.slice(1)));
show(location.hash.slice(1) || ls.get(KEY) || slugs[0]);

// backup/restauração do progresso (todas as chaves nd:* do navegador)
document.getElementById('exp').onclick = () => {
  const o = {};
  try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k.startsWith('nd:')) o[k] = localStorage.getItem(k); } } catch(e){}
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(o)], {type:'application/json'}));
  a.download = 'study-hubs-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
};
document.getElementById('imp').onclick = () => document.getElementById('file').click();
document.getElementById('file').onchange = async e => {
  const f = e.target.files[0]; if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    for (const k in o) if (k.startsWith('nd:')) ls.set(k, o[k]);
    location.reload();
  } catch(err) { alert('Arquivo inválido'); }
};
</script>
</body>
</html>
